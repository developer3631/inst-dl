<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تحميل من انستغرام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1f8; --surface:#ffffff; --ink:#1d1b2e; --muted:#6b6880;
  --accent:#6a3df0; --accent-ink:#ffffff; --line:#dedaeb; --danger:#b3261e;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14121f; --surface:#1e1b2f; --ink:#f1eefc; --muted:#a29fb8;
         --accent:#9a7bff; --accent-ink:#14121f; --line:#322e49; --danger:#ff8a80; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.7;
  min-height:100vh;display:flex;justify-content:center;padding:24px 16px}
main{width:100%;max-width:520px}
h1{font-size:2rem;line-height:1.3;margin:24px 0 8px;font-weight:700}
p.lead{margin:0 0 24px;color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
input{width:100%;padding:14px;font:inherit;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:10px;direction:ltr;text-align:left}
input:focus,button:focus-visible,a:focus-visible,video:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;margin-top:12px}
button,.btn{display:block;flex:1;padding:14px;font:inherit;font-weight:600;
  text-align:center;text-decoration:none;color:var(--accent-ink);background:var(--accent);
  border:1px solid var(--accent);border-radius:10px;cursor:pointer}
button.alt,.btn.alt{color:var(--ink);background:transparent;border-color:var(--line)}
#clear{flex:0 0 auto;padding:14px 20px}
button:disabled{opacity:.6;cursor:wait}
#msg{margin:16px 0 0;min-height:1.5em;color:var(--danger);white-space:pre-wrap}
#msg small{display:block;margin-top:8px;color:var(--muted);direction:ltr;text-align:left;word-break:break-word}
#results{display:grid;gap:16px;margin-top:16px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item img,.item video{display:block;width:100%;max-height:420px;object-fit:contain;background:#000}
.item .row{padding:12px;margin:0}
.item .note{margin:0;padding:8px 12px 0;color:var(--muted);font-size:.9rem}
footer{margin-top:32px;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<main>
  <h1>حمّل بوست أو ريل من انستغرام</h1>
  <p class="lead">الصق الرابط واضغط «جلب الملف». يعمل مع الحسابات العامة فقط.</p>

  <div class="box">
    <input id="url" type="url" inputmode="url" placeholder="https://www.instagram.com/reel/..." autocomplete="off">
    <div class="row">
      <button id="go">جلب الملف</button>
      <button id="clear" class="alt" type="button">مسح</button>
    </div>
  </div>

  <p id="msg" role="alert"></p>
  <section id="results" aria-live="polite"></section>

  <footer>للاستخدام الشخصي فقط. احترم حقوق صاحب المحتوى ولا تعد نشره دون إذنه. الموقع غير تابع لانستغرام.</footer>
</main>

<script>
const $ = id => document.getElementById(id);
const input = $("url"), btn = $("go"), clearBtn = $("clear"), msg = $("msg"), results = $("results");

function fileUrl(it, inline){
  return "/api/dl?u=" + encodeURIComponent(it.url)
    + "&n=" + encodeURIComponent(it.filename)
    + (it.audio_url ? "&a=" + encodeURIComponent(it.audio_url) : "")
    + (inline ? "&inline=1" : "");
}

function buildCard(it){
  const card = document.createElement("div"); card.className = "item";
  let thumb = null;
  if(it.thumb){
    thumb = document.createElement("img");
    thumb.alt = ""; thumb.src = "/api/dl?u=" + encodeURIComponent(it.thumb) + "&n=thumb.jpg&inline=1";
    card.append(thumb);
  }
  const note = document.createElement("p"); note.className = "note"; note.hidden = true;
  const row = document.createElement("div"); row.className = "row";

  let preview;
  if(it.type === "image"){
    preview = document.createElement("a");
    preview.href = fileUrl(it, true); preview.target = "_blank"; preview.rel = "noopener";
    preview.textContent = "معاينة";
  }else{
    preview = document.createElement("button"); preview.type = "button";
    preview.textContent = "معاينة";
    preview.addEventListener("click", () => toggleVideo(card, it, thumb, preview, note));
  }
  preview.classList.add("alt"); if(preview.tagName === "A") preview.classList.add("btn");

  const dl = document.createElement("a"); dl.className = "btn";
  dl.href = fileUrl(it, false);
  dl.textContent = it.type === "image" ? "تحميل الصورة" : "تحميل الفيديو";

  row.append(preview, dl);
  card.append(note, row);
  return card;
}

function toggleVideo(card, it, thumb, btn, note){
  const old = card.querySelector("video");
  if(old){ old.remove(); if(thumb) thumb.hidden = false; btn.textContent = "معاينة"; note.hidden = true; return; }

  const v = document.createElement("video");
  v.controls = true; v.autoplay = true; v.playsInline = true;
  if(thumb) v.poster = thumb.src;
  v.src = fileUrl(it, true);
  card.insertBefore(v, thumb || card.firstChild);
  if(thumb) thumb.hidden = true;
  btn.textContent = "إيقاف المعاينة";
  note.textContent = "جارٍ تجهيز المعاينة، قد يستغرق ذلك عدة ثوانٍ..."; note.hidden = false;

  v.addEventListener("loadeddata", () => { note.hidden = true; });
  v.addEventListener("error", () => {
    v.remove(); if(thumb) thumb.hidden = false; btn.textContent = "معاينة";
    note.textContent = "تعذرت المعاينة. جرّب التحميل مباشرة."; note.hidden = false;
  });
}

async function run(){
  msg.textContent = ""; results.replaceChildren();
  const link = input.value.trim();
  if(!link){ msg.textContent = "الصق رابط انستغرام أولاً."; return; }

  btn.disabled = true; btn.textContent = "جارٍ الجلب...";
  try{
    const res = await fetch("/api/info?url=" + encodeURIComponent(link));
    const data = await res.json();
    if(!res.ok){
      msg.textContent = data.error || "حدث خطأ غير متوقع.";
      if(data.detail){ const d = document.createElement("small"); d.textContent = data.detail; msg.append(d); }
      return;
    }
    data.items.forEach(it => results.append(buildCard(it)));
  }catch(e){
    msg.textContent = "تعذر الاتصال بالخادم. حاول مرة أخرى.";
  }finally{
    btn.disabled = false; btn.textContent = "جلب الملف";
  }
}

function clearAll(){
  input.value = ""; msg.textContent = ""; results.replaceChildren(); input.focus();
}

btn.addEventListener("click", run);
clearBtn.addEventListener("click", clearAll);
input.addEventListener("keydown", e => { if(e.key === "Enter") run(); });
</script>
</body>
</html>
