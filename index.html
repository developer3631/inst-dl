<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تحميل من انستغرام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1f8; --surface:#ffffff; --ink:#1d1b2e; --muted:#6b6880;
  --accent:#6a3df0; --accent-ink:#ffffff; --line:#dedaeb; --danger:#b3261e;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14121f; --surface:#1e1b2f; --ink:#f1eefc; --muted:#a29fb8;
         --accent:#9a7bff; --accent-ink:#14121f; --line:#322e49; --danger:#ff8a80; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.7;
  min-height:100vh;display:flex;justify-content:center;padding:24px 16px}
main{width:100%;max-width:520px}
h1{font-size:2rem;line-height:1.3;margin:24px 0 8px;font-weight:700}
p.lead{margin:0 0 24px;color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
input{width:100%;padding:14px;font:inherit;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:10px;direction:ltr;text-align:left}
input:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button,.btn{display:block;width:100%;margin-top:12px;padding:14px;font:inherit;font-weight:600;
  text-align:center;text-decoration:none;color:var(--accent-ink);background:var(--accent);
  border:0;border-radius:10px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#msg{margin:16px 0 0;min-height:1.5em;color:var(--danger)}
#results{display:grid;gap:16px;margin-top:16px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item img{display:block;width:100%;max-height:360px;object-fit:cover;background:var(--line)}
.item .btn{margin:12px;width:calc(100% - 24px)}
footer{margin-top:32px;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<main>
  <h1>حمّل بوست أو ريل من انستغرام</h1>
  <p class="lead">الصق الرابط واضغط «جلب الملف». يعمل مع الحسابات العامة فقط.</p>

  <div class="box">
    <input id="url" type="url" inputmode="url" placeholder="https://www.instagram.com/reel/..." autocomplete="off">
    <button id="go">جلب الملف</button>
  </div>

  <p id="msg" role="alert"></p>
  <section id="results" aria-live="polite"></section>

  <footer>للاستخدام الشخصي فقط. احترم حقوق صاحب المحتوى ولا تعد نشره دون إذنه. الموقع غير تابع لانستغرام.</footer>
</main>

<script>
const $ = id => document.getElementById(id);
const input = $("url"), btn = $("go"), msg = $("msg"), results = $("results");

async function run(){
  msg.textContent = ""; results.replaceChildren();
  const link = input.value.trim();
  if(!link){ msg.textContent = "الصق رابط انستغرام أولاً."; return; }

  btn.disabled = true; btn.textContent = "جارٍ الجلب...";
  try{
    const res = await fetch("/api/info?url=" + encodeURIComponent(link));
    const data = await res.json();
    if(!res.ok){ msg.textContent = data.error || "حدث خطأ غير متوقع."; return; }

    data.items.forEach((it, i) => {
      const card = document.createElement("div"); card.className = "item";
      if(it.thumb){
        const img = document.createElement("img");
        img.alt = ""; img.src = "/api/dl?u=" + encodeURIComponent(it.thumb) + "&n=thumb.jpg";
        card.append(img);
      }
      const a = document.createElement("a"); a.className = "btn";
      a.href = "/api/dl?u=" + encodeURIComponent(it.url) + "&n=" + encodeURIComponent(it.filename)
        + (it.audio_url ? "&a=" + encodeURIComponent(it.audio_url) : "");
      a.textContent = it.type === "image" ? "تحميل الصورة" : "تحميل الفيديو";
      card.append(a); results.append(card);
    });
  }catch(e){
    msg.textContent = "تعذر الاتصال بالخادم. حاول مرة أخرى.";
  }finally{
    btn.disabled = false; btn.textContent = "جلب الملف";
  }
}
btn.addEventListener("click", run);
input.addEventListener("keydown", e => { if(e.key === "Enter") run(); });
</script>
</body>
</html>
